apiVersion: apps/v1
kind: Deployment
metadata:
  name: su-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: su-ai
  template:
    metadata:
      labels:
        app: su-ai
    spec:
      containers:
      - name: su-ai-app
        image: gcr.io/su-city/su-ai:1.0.0
        ports:
        - containerPort: 3001
        env:
          - name: PORT
            value: "3001"
          - name: ADMIN_USERNAME
            valueFrom:
              secretKeyRef:
                name: su-secret-config
                key: admin-username
          - name: ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: su-secret-config
                key: admin-password
          - name: MILVUS_HOST
            valueFrom:
              secretKeyRef:
                name: su-secret-config
                key: milvus-host
          - name: MYSQL_HOST
            valueFrom:
              secretKeyRef:
                name: su-secret-config
                key: mysql-host
          - name: MYSQL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: su-secret-config
                key: mysql-password
