apiVersion: apps/v1
kind: Deployment
metadata:
  name: su-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: su-ai
  template:
    metadata:
      labels:
        app: su-ai
    spec:
      containers:
      - name: su-ai-app
        image: gcr.io/su-city/su-ai:latest
        ports:
        - containerPort: 3001
        env:
          - name: PORT
            value: "3001"